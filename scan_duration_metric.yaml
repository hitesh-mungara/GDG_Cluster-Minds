name: scan_duration_seconds
description: Duration of Trivy scans in seconds
filter: resource.type="cloud_run_revision" AND resource.labels.service_name="trivy-api" AND jsonPayload.event="scan_completed"
valueExtractor: EXTRACT(jsonPayload.duration_seconds)
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: s